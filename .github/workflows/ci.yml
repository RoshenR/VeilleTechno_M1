name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No production secret is used anywhere in this workflow: contributions from forks run the same jobs.
# The integration job starts an isolated, throwaway Supabase inside the runner.

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders: the build never contacts these.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (domain rules, parsers, semver comparison, GitHub client, SSRF guard, relevance set)
        run: npx vitest run src
      - run: npm run build

  integration:
    name: Integration (isolated Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a throwaway Supabase (applies every migration)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Point the tests at it
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local
      - run: npx vitest run tests/integration
      - if: always()
        run: npx supabase stop --no-backup
